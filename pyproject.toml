[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calamar"
version = "0.1.0"
description = "A modular AI agent engine with intelligent model routing, multi-agent collaboration, and middleware pipeline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "hqlalala" }]
keywords = ["ai", "agent", "llm", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "openai>=2.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.80.0"]
code-index = ["tree-sitter>=0.23.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
calamar = "calamar.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "S", "B", "A", "C4", "SIM", "PLW1514"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["calamar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
